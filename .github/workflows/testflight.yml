# Sends KeyCatch for iPhone to TestFlight when a push to the KeyCatch branch changes
# .github/testflight.txt, whose first word is the version (e.g. 0.1.0), as in the Bible app.
# Other pushes never upload. The build number is this workflow's run number and attempt.
# Signing is cloud-managed, as in the Bible app: one App Store Connect API key (Admin role) lets
# Xcode create the certificate and profile and upload the build. The four secrets are listed in
# ios/README.md; the Bible repository uses the same names and the same values work.
name: TestFlight

on:
  push:
    branches: [claude/android-music-key-tempo-dygdp2]
    paths: [".github/testflight.txt"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets and the version
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY TEAM_ID; do
            test -n "${!v}" || missing="$missing $v"
          done
          test -z "$missing" || { echo "::error::Missing secrets:$missing (see ios/README.md, TestFlight)"; exit 1; }
          VERSION=$(awk 'NF { print $1; exit }' .github/testflight.txt)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] \
            || { echo "::error::.github/testflight.txt must start with a version like 0.1.0 (found '$VERSION')"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Show Xcode
        run: xcodebuild -version

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      # As in the Bible app's workflow: the secret may hold the .p8 file as it is, with its line
      # breaks lost or written as \n, only the part between BEGIN and END, or base64 of the file.
      # It is rebuilt into the form Xcode reads and checked; nothing of it is printed.
      - name: Write the API key
        run: |
          umask 077
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          python3 - "$KEY_PATH" <<'PY'
          import base64, os, re, sys
          raw = os.environ["ASC_KEY"].replace("\\n", "\n").replace("\r", "")
          if "BEGIN PRIVATE KEY" not in raw:
              try:
                  decoded = base64.b64decode(re.sub(r"\s+", "", raw), validate=True).decode("ascii")
              except Exception:
                  decoded = ""
              if "BEGIN PRIVATE KEY" in decoded:
                  raw = decoded
          m = re.search(r"-----BEGIN PRIVATE KEY-----(.*?)-----END PRIVATE KEY-----", raw, re.S)
          body = re.sub(r"\s+", "", m.group(1) if m else raw)
          if not re.fullmatch(r"[A-Za-z0-9+/]+=*", body or "!"):
              sys.exit("APP_STORE_CONNECT_KEY does not look like a .p8 key: paste the whole file, BEGIN and END lines included")
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          open(sys.argv[1], "w").write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n")
          PY
          openssl pkey -in "$KEY_PATH" -noout 2>/dev/null \
            || { rm -f "$KEY_PATH"; echo "::error::APP_STORE_CONNECT_KEY is not a readable private key"; exit 1; }
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Unsigned here: automatic signing at this step would make a development profile, which
      # needs a registered device. The upload step signs for the App Store, which needs none.
      # On failure only the error lines are shown; the full log is thousands of lines.
      - name: Archive
        working-directory: ios
        run: |
          echo "KeyCatch $VERSION ($BUILD)"
          xcodebuild -project KeyCatch.xcodeproj -scheme KeyCatch -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/KeyCatch.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            archive > ../archive.log 2>&1 \
            || { grep -E -A 6 "error:|ARCHIVE FAILED" ../archive.log | head -100; exit 1; }
          grep -E "ARCHIVE SUCCEEDED" ../archive.log

      - name: Sign and upload to App Store Connect
        working-directory: ios
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/KeyCatch.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > ../export.log 2>&1 \
            || { grep -iE "error|failed" ../export.log | sort -u | head -100; exit 1; }
          grep -iE "upload|succeeded|EXPORT SUCCEEDED" ../export.log | tail -5
          echo "Uploaded KeyCatch $VERSION ($BUILD). Apple takes a few minutes to process it before it shows in TestFlight."

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
