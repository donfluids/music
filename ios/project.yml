# The Xcode project is generated from this file with XcodeGen (`cd ios && xcodegen generate`),
# so KeyCatch.xcodeproj is not kept in git.
name: KeyCatch
options:
  bundleIdPrefix: com.donfluids
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  KeyCatchCore:
    path: KeyCatchCore
targets:
  KeyCatch:
    type: application
    platform: iOS
    sources:
      - path: KeyCatch/Sources
      - path: KeyCatch/Resources
    dependencies:
      - package: KeyCatchCore
    info:
      path: KeyCatch/Info.plist
      properties:
        CFBundleDisplayName: KeyCatch
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.music
        NSMicrophoneUsageDescription: KeyCatch listens to the music to find its key, chords and tempo. The sound is analysed on this iPhone and is not sent anywhere.
        UIAppFonts:
          - Manrope-Regular.ttf
          - Manrope-Medium.ttf
          - Manrope-SemiBold.ttf
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donfluids.keycatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: true
        # Set DEVELOPMENT_TEAM here (or pass it to xcodebuild) to install on an iPhone.
        CODE_SIGN_STYLE: Automatic
